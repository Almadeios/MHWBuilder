name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run desktop:ci-build

      - name: Publish all release files together
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/MHW-Builder-Setup-*.exe
            release/MHW-Builder-Setup-*.exe.blockmap
            release/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
